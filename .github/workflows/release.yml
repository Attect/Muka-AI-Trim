name: 发布

on:
  push:
    tags: ["v*"]
  # 补发/重试用：Actions 页面手动运行，填要发布的 tag（默认 v0.1.0 那种形式）。
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag；留空则取触发 ref
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  binaries:
    name: 打包 ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x86_64
            bin: muka-ai-trim.exe
          - os: ubuntu-latest
            asset: linux-x86_64
            bin: muka-ai-trim
          - os: macos-latest
            asset: macos-aarch64
            bin: muka-ai-trim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建
        run: cargo build --release -p muka-bin
      # Windows 自带的 tar 是 bsdtar，同样能产出 .tar.gz，三端一条命令。
      # 必须显式用 bash：Windows 默认是 PowerShell，那里 ${TAG} 取不到环境变量，
      # 文件名会少掉版本号。
      - name: 打包
        shell: bash
        run: tar czf muka-ai-trim-${TAG}-${{ matrix.asset }}.tar.gz -C target/release ${{ matrix.bin }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: muka-ai-trim-*.tar.gz

  release:
    name: 建 Release 并挂上二进制
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 这个 job 没有 checkout，没有 .git 可推断仓库，所以 -R 必须显式给。
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "为 AI 请求节省 99% 的网络流量。安装与用法见 README。" \
            --latest || true
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" assets/* --clobber
